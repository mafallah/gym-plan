<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Plan">
<title>GB3 Gym Plan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card2: #273549; --line: #334155;
    --text: #e2e8f0; --dim: #94a3b8; --accent: #38bdf8; --accent2: #f59e0b;
    --ok: #34d399; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  a { color: var(--accent); }

  /* Home */
  .home-title { font-size: 1.7rem; font-weight: 800; margin-top: 8px; }
  .home-sub { color: var(--dim); margin: 4px 0 20px; font-size: .95rem; }
  .day-btn {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 16px; margin-bottom: 12px; color: var(--text); text-align: left;
    font-size: 1.05rem; cursor: pointer;
  }
  .day-btn:active { background: var(--card2); }
  .day-btn .emoji { font-size: 1.6rem; }
  .day-btn .dname { font-weight: 700; }
  .day-btn .ddetail { color: var(--dim); font-size: .85rem; margin-top: 2px; }
  .day-btn .chev { margin-left: auto; color: var(--dim); }

  .rules { margin-top: 24px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .rules h3 { font-size: 1rem; margin-bottom: 10px; }
  .rules li { color: var(--dim); font-size: .9rem; margin: 0 0 8px 18px; }
  .warmup { background: #16283e; border: 1px solid #1e3a5f; color: #bae6fd; border-radius: var(--radius); padding: 12px 14px; font-size: .9rem; margin-bottom: 16px; }

  /* Day view */
  .topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 5; }
  .back-btn { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 14px; font-size: 1rem; cursor: pointer; }
  .topbar h2 { font-size: 1.15rem; }
  .topbar .tdetail { color: var(--dim); font-size: .8rem; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 12px; overflow: hidden;
  }
  .card-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .card-head img.thumb { width: 56px; height: 56px; border-radius: 10px; background: #fff; object-fit: cover; flex-shrink: 0; }
  .thumb-ph { width: 56px; height: 56px; border-radius: 10px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
  .num { color: var(--accent); font-weight: 800; font-size: .95rem; min-width: 22px; }
  .ex-name { font-weight: 700; font-size: 1rem; line-height: 1.25; }
  .ex-fa { color: var(--dim); font-size: .9rem; direction: rtl; }
  .ex-sets { color: var(--accent2); font-size: .85rem; font-weight: 600; margin-top: 2px; }
  .swapped-badge { display: inline-block; background: #3b2f14; color: var(--accent2); font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-top: 3px; }
  .card-head .chev { margin-left: auto; color: var(--dim); transition: transform .2s; }
  .card.open .chev { transform: rotate(90deg); }

  .card-body { display: none; border-top: 1px solid var(--line); padding: 14px; }
  .card.open .card-body { display: block; }
  .gif-wrap { display: flex; justify-content: center; background: #fff; border-radius: 10px; padding: 8px; margin-bottom: 12px; }
  .gif-wrap img { width: 200px; height: 200px; object-fit: contain; }
  .gif-missing { background: var(--card2); color: var(--dim); border-radius: 10px; padding: 24px; text-align: center; margin-bottom: 12px; font-size: .9rem; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { background: var(--card2); color: var(--dim); font-size: .75rem; padding: 4px 10px; border-radius: 20px; }
  .steps li { color: var(--text); font-size: .92rem; margin: 0 0 10px 18px; line-height: 1.45; }
  .note { background: #2d2515; border: 1px solid #4a3b1a; color: #fcd34d; border-radius: 10px; padding: 10px 12px; font-size: .85rem; margin-bottom: 12px; }
  .swap-btn {
    display: block; width: 100%; margin-top: 4px; background: var(--card2); color: var(--accent);
    border: 1px dashed var(--line); border-radius: 10px; padding: 12px; font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  .swap-btn:active { background: var(--line); }

  .cardio-card { background: #12291f; border: 1px solid #1d4432; }
  .cardio-card .num { color: var(--ok); }
  .cardio-card .ex-sets { color: var(--ok); }

  footer { color: var(--dim); font-size: .75rem; text-align: center; margin-top: 28px; line-height: 1.6; }
  .offline-tip { color: var(--dim); font-size: .8rem; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">Loading…</div>
<script>
let PLAN = null, EX = null;

async function loadData() {
  const [p, e] = await Promise.all([
    fetch('plan.json').then(r => r.json()),
    fetch('exercises.json').then(r => r.json()),
  ]);
  PLAN = p; EX = e;
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const m = location.hash.match(/^#\/day\/(.+)$/);
  const day = m && PLAN.days.find(d => d.id === m[1]);
  app.appendChild(day ? dayView(day) : homeView());
  window.scrollTo(0, 0);
}

function homeView() {
  const v = el('<div></div>');
  v.appendChild(el(`<h1 class="home-title">${esc(PLAN.meta.title)}</h1>`));
  v.appendChild(el(`<p class="home-sub">${esc(PLAN.meta.subtitle)} · updated ${esc(PLAN.meta.updated)}</p>`));
  for (const d of PLAN.days) {
    const b = el(`<button class="day-btn">
      <span class="emoji">${d.emoji}</span>
      <span><div class="dname">${esc(d.name_en)}</div><div class="ddetail">${esc(d.detail)} · ${d.exercises.length} exercises</div></span>
      <span class="chev">›</span></button>`);
    b.onclick = () => { location.hash = '#/day/' + d.id; };
    v.appendChild(b);
  }
  const rules = el(`<div class="rules"><h3>Rules for the month</h3><ul></ul></div>`);
  for (const r of PLAN.meta.rules) rules.querySelector('ul').appendChild(el(`<li>${esc(r)}</li>`));
  v.appendChild(rules);
  v.appendChild(el(`<footer>Exercise animations &amp; thumbnails © <a href="https://gymvisual.com/" target="_blank" rel="noopener">Gym Visual</a><br>
    Data: <a href="https://github.com/hasaneyldrm/exercises-dataset" target="_blank" rel="noopener">exercises-dataset</a> (MIT)</footer>`));
  return v;
}

function dayView(day) {
  const v = el('<div></div>');
  const top = el(`<div class="topbar"><button class="back-btn">‹ Back</button>
    <div><h2>${day.emoji} ${esc(day.name_en)}</h2><div class="tdetail">${esc(day.detail)}</div></div></div>`);
  top.querySelector('.back-btn').onclick = () => { location.hash = '#/'; };
  v.appendChild(top);
  v.appendChild(el(`<div class="warmup">🔆 ${esc(PLAN.meta.warmup)}</div>`));
  for (const ex of day.exercises) v.appendChild(exerciseCard(ex));
  if (day.cardio) v.appendChild(cardioCard(day.cardio));
  v.appendChild(el(`<div class="offline-tip">Tap a card for the animation &amp; how-to. “Machine taken?” swaps the exercise.</div>`));
  return v;
}

// variant: 0 = primary, 1..n = swaps
function currentVariant(ex, idx) {
  if (idx === 0) return { name_en: ex.name_en, name_fa: ex.name_fa, dataset_id: ex.dataset_id,
                          note: ex.note, custom_instructions: ex.custom_instructions, swapped: false };
  const s = ex.swaps[idx - 1];
  return { name_en: s.name_en, name_fa: s.name_fa, dataset_id: s.dataset_id,
           note: s.note, custom_instructions: s.custom_instructions, swapped: true };
}

function exerciseCard(ex) {
  const nVariants = 1 + (ex.swaps ? ex.swaps.length : 0);
  let idx = 0, open = false;
  const card = el('<div class="card"></div>');

  function draw() {
    const va = currentVariant(ex, idx);
    const rec = va.dataset_id ? EX[va.dataset_id] : null;
    card.classList.toggle('open', open);
    card.innerHTML = '';

    const thumb = rec
      ? `<img class="thumb" loading="lazy" src="${esc(rec.thumb)}" alt="">`
      : `<div class="thumb-ph">🤸</div>`;
    const head = el(`<div class="card-head">${thumb}
      <span class="num">${esc(ex.num)}</span>
      <span><div class="ex-name">${esc(va.name_en)}</div>
        ${va.name_fa ? `<div class="ex-fa">${esc(va.name_fa)}</div>` : ''}
        <div class="ex-sets">${esc(ex.sets)}</div>
        ${va.swapped ? '<span class="swapped-badge">SWAPPED</span>' : ''}</span>
      <span class="chev">›</span></div>`);
    head.onclick = () => { open = !open; draw(); };
    card.appendChild(head);

    const body = el('<div class="card-body"></div>');
    if (open) {
      if (rec) {
        body.appendChild(el(`<div class="gif-wrap"><img src="${esc(rec.gif)}" alt="${esc(va.name_en)} animation"></div>`));
        body.appendChild(el(`<div class="chips"><span class="chip">🎯 ${esc(rec.target)}</span><span class="chip">🛠 ${esc(rec.equipment)}</span></div>`));
      } else {
        body.appendChild(el(`<div class="gif-missing">No animation for this one — follow the steps below.</div>`));
      }
      if (va.note) body.appendChild(el(`<div class="note">⚠️ ${esc(va.note)}</div>`));
      const steps = va.custom_instructions || (rec ? rec.steps : []);
      if (steps.length) {
        const ol = el('<ol class="steps"></ol>');
        for (const s of steps) ol.appendChild(el(`<li>${esc(s)}</li>`));
        body.appendChild(ol);
      }
    }
    if (nVariants > 1) {
      const nextName = currentVariant(ex, (idx + 1) % nVariants).name_en;
      const sb = el(`<button class="swap-btn">${idx + 1 < nVariants ? '🔁 Machine taken? Swap to: ' : '↩︎ Back to: '}${esc(nextName)}</button>`);
      sb.onclick = (e) => { e.stopPropagation(); idx = (idx + 1) % nVariants; draw(); };
      body.appendChild(sb);
      body.style.display = 'block';
      if (!open) { body.style.borderTop = 'none'; body.style.paddingTop = '0'; }
    }
    card.appendChild(body);
  }
  draw();
  return card;
}

function cardioCard(cardio) {
  const rec = cardio.dataset_id ? EX[cardio.dataset_id] : null;
  let open = false;
  const card = el('<div class="card cardio-card"></div>');
  function draw() {
    card.classList.toggle('open', open);
    card.innerHTML = '';
    const thumb = rec ? `<img class="thumb" loading="lazy" src="${esc(rec.thumb)}" alt="">` : `<div class="thumb-ph">🚴</div>`;
    const head = el(`<div class="card-head">${thumb}<span class="num">➕</span>
      <span><div class="ex-name">Then: ${esc(cardio.name_en)}</div><div class="ex-sets">${esc(cardio.detail)}</div></span>
      <span class="chev">›</span></div>`);
    head.onclick = () => { open = !open; draw(); };
    card.appendChild(head);
    if (open && rec) {
      const body = el('<div class="card-body"></div>');
      body.appendChild(el(`<div class="gif-wrap"><img src="${esc(rec.gif)}" alt=""></div>`));
      card.appendChild(body);
    }
  }
  draw();
  return card;
}

// Warm the offline cache with all GIFs/thumbnails once the page is idle.
function warmCache() {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
  const urls = [];
  for (const rec of Object.values(EX)) { urls.push(rec.gif, rec.thumb); }
  let i = 0;
  function next() {
    if (i >= urls.length) return;
    const batch = urls.slice(i, i += 4);
    Promise.all(batch.map(u => fetch(u, { mode: 'no-cors' }).catch(() => {})))
      .then(() => setTimeout(next, 150));
  }
  next();
}

(async function init() {
  try {
    await loadData();
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<p style="padding:40px 10px;text-align:center;color:#94a3b8">Could not load the plan (offline before first sync?).<br>Open the app once with internet.</p>';
    return;
  }
  window.addEventListener('hashchange', render);
  render();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(() => setTimeout(warmCache, 3000));
  }
})();
</script>
</body>
</html>
